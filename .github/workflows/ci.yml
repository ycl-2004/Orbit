name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          [[ -n "$XCODE_APP" ]] || { echo "Xcode 26 is not installed on this runner" >&2; exit 1; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcode-select --print-path
          xcodebuild -version

      - name: Validate metadata and test counts
        run: bash scripts/ci_validate.sh

      - name: Build Debug Universal 2
        run: |
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/ci \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Run OrbitTests
        run: |
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/ci \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test -only-testing:OrbitTests
