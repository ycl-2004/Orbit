name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select Xcode 27.2
        run: |
          XCODE_APP=/Applications/Xcode_27.2.app
          [[ -d "$XCODE_APP" ]] || { echo "$XCODE_APP is not installed on this runner" >&2; exit 1; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcode-select --print-path
          xcodebuild -version

      - name: Validate version metadata
        run: bash scripts/ci_validate.sh

      - name: Build Debug Universal 2
        run: |
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/ci \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Run OrbitTests
        run: |
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/ci \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test -only-testing:OrbitTests
